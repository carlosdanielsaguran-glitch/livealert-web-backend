<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveAlert — Set Your Password</title>
  <link rel="stylesheet" href="change-password.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div id="change-password-page" class="page active">
    <div class="login-wrapper">
      <div class="login-card" id="login-card">
        <div class="login-logo">
          <span class="logo-live">Live</span><span class="logo-alert">Alert</span>
        </div>

        <p class="login-subtitle">Set Your Password</p>
        <p class="change-password-hint">
          You're signed in with the default password. Choose a personal one
          to continue — you'll use this to log in from now on.
        </p>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="new-password" placeholder="Min. 8 characters" autocomplete="new-password" />
            <i class="fa-solid fa-eye-slash password-toggle-icon" id="toggle-new-pass"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirm-password" placeholder="Re-type password" autocomplete="new-password" />
            <i class="fa-solid fa-eye-slash password-toggle-icon" id="toggle-confirm-pass"></i>
          </div>
        </div>

        <button class="btn-login" id="set-password-btn">Set Password &amp; Continue</button>

        <p class="login-error" id="change-error"></p>
        <p class="login-success" id="change-success"></p>
      </div>
    </div>
  </div>

  <script src="../connection/config.js"></script>
  <script src="../connection/backend_connection.js"></script>
  <script src="change-password.js"></script>
</body>
</html>
